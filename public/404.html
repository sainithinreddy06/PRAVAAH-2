<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading PRAVAAH</title>
  </head>
  <body>
    <p>Returning to your page…</p>
    <script>
      (function () {
        var target = window.location.pathname + window.location.search + window.location.hash;
        try { sessionStorage.setItem('spa-redirect', target); } catch (e) {}
        window.location.replace('/');
      })();
    </script>
  </body>
</html>
