name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pravaah_test
          POSTGRES_USER: pravaah
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pravaah -d pravaah_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://pravaah:ci_test_password@localhost:5432/pravaah_test
      JWT_SECRET_KEY: ci-only-test-secret-change-before-deployment-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate migration graph
        run: alembic history
      - name: Apply migrations to PostgreSQL
        run: alembic upgrade head
      - name: Verify migration head
        run: alembic current
      - name: Run tests
        run: pytest
      - name: Lint
        run: ruff check app tests migrations
